<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CounselFlow — your AKTU/UPTAC counselling strategist." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/brand/counselflow-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>CounselFlow</title>
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('counselflow-theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light'
          }
        } catch (e) {
          theme = 'dark'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
